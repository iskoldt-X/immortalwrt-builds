# Shared build pipeline.
#
# The three build-*.yml files next to this one are thin callers that supply only
# the parameters below; every actual step lives here, so a fix lands in one place
# instead of being copied three times and drifting.

name: build

on:
  workflow_call:
    inputs:
      source_url:
        description: Source tree to clone.
        required: true
        type: string
      source_branch:
        description: Branch of that tree.
        required: true
        type: string
      config_file:
        description: Config at the repository root, copied to openwrt/.config.
        required: true
        type: string
      target_assert:
        description: A .config line that must survive `make defconfig`, e.g. CONFIG_TARGET_x86_64=y.
        required: true
        type: string
      package_assert:
        description: A second line that must survive, as a canary for a silently emptied config.
        required: false
        type: string
        default: CONFIG_PACKAGE_luci-app-openclash=y
      xray_asset:
        description: Upstream Xray release asset for this architecture.
        required: true
        type: string
      xray_arch:
        description: Architecture string that `file` must report for the extracted binary.
        required: true
        type: string
      xray_runnable:
        description: True when the runner can execute the binary, which also allows asserting its version.
        required: false
        type: boolean
        default: false
      golang_feed:
        description: Swap in a newer golang feed. Needed on trees whose own feed is too old to build sing-box.
        required: false
        type: boolean
        default: false
      tag_prefix:
        description: Release tag prefix. Also names the artifact and groups the releases for pruning.
        required: true
        type: string
      go_speedups:
        description: Bootstrap host Go from the runner's Go instead of building the go1.4 chain, and cache Go builds.
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # publish releases, delete old tags
  actions: write    # prune old workflow runs

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    # GitHub-hosted runners are killed at 6 hours no matter what this says, so a
    # larger number would only pretend to be a limit.
    timeout-minutes: 360
    concurrency:
      # One build per device at a time: a manual run that collides with the weekly
      # schedule would otherwise have two jobs publishing and pruning releases.
      group: ${{ inputs.tag_prefix }}
      cancel-in-progress: false

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install build dependencies
      # Runs BEFORE the disk-space step on purpose. `maximize-build-space` hands
      # almost all free space to /workdir and leaves root-reserve-mb on /, which is
      # not enough for this list: asciidoc drags in the whole of texlive and dpkg
      # dies with "No space left on device". Install first, reclaim second.
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        # The runner image carries extra apt sources that are slow and occasionally
        # broken; restore the plain Ubuntu 24.04 set.
        sudo tee /etc/apt/sources.list > /dev/null << 'EOF'
        deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu noble-backports main restricted universe multiverse
        deb http://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
        EOF
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo apt-get update -y
        # Deliberately no `|| true`: a missing build dependency has to fail here,
        # not three hours later inside `make` wearing a different mask.
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
          binutils bison build-essential bzip2 ccache clang cmake cpio curl \
          device-tree-compiler flex gawk gettext git gperf haveged help2man intltool \
          libelf-dev libfuse-dev libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
          lrzsz genisoimage msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
          python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools \
          subversion swig texinfo unzip vim wget xmlto xxd zlib1g-dev
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Free up disk space
      # x86/64 generic emits ~20 raw disk images, each dd'd out to
      # CONFIG_TARGET_ROOTFS_PARTSIZE and not sparse, which ran the partition out of
      # space from 2026-08-17 onward. Symlinking the tree onto /mnt only moved it and
      # freed nothing, so every target uses this instead.
      uses: easimon/maximize-build-space@v10
      with:
        build-mount-path: '/workdir'
        # Raising this does not leave more room on /: on current runners /mnt is the
        # same filesystem, and the second (temp) loop PV then takes everything down to
        # temp-reserve-mb anyway. Room for cache archives is made in the next step.
        root-reserve-mb: 5120
        swap-size-mb: 1
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Take ownership of the build mount
      run: |
        set -euo pipefail
        sudo chown -R "$USER":"$GROUPS" /workdir
        df -hT /workdir

    - name: Make room on the root filesystem for cache archives
      # actions/cache builds its archive under RUNNER_TEMP on / (a step-level
      # RUNNER_TEMP override is ignored), and maximize-build-space leaves only ~100MB
      # there, so the Go cache save failed with "No space left on device" (reported
      # only as a warning). Space freed AFTER the LVM is built stays on /, so drop
      # preinstalled toolchains this build never uses. setup-go runs later and puts
      # its Go back under /opt/hostedtoolcache.
      run: |
        df -h /
        sudo du -sh /opt/hostedtoolcache /usr/lib/jvm /usr/share/swift /usr/local/share/powershell \
          /usr/local/lib/node_modules /opt/microsoft /opt/google 2>/dev/null || true
        sudo rm -rf /opt/hostedtoolcache/* /usr/lib/jvm /usr/share/swift /usr/local/share/powershell \
          /usr/local/lib/node_modules /opt/microsoft /opt/google
        df -h /

    - name: Clone source code
      working-directory: /workdir
      run: |
        set -euo pipefail
        df -hT "$PWD"
        git clone "${{ inputs.source_url }}" -b "${{ inputs.source_branch }}" openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
        if [ "${{ inputs.golang_feed }}" = "true" ]; then
          echo "src-git golang https://github.com/sbwml/packages_lang_golang;26.x" >> openwrt/feeds.conf.default
        fi

    - name: Update and install feeds
      run: |
        set -euo pipefail
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        if [ "${{ inputs.golang_feed }}" = "true" ]; then
          ./scripts/feeds uninstall golang
          ./scripts/feeds install -p golang golang
        fi

    - name: Fetch upstream Xray binary into files/
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        # The packages feed lags upstream badly (25.2.21 at the time of writing) and
        # Xray 26.9.8 changed the REALITY handshake requirements, so an old client
        # cannot connect at all. Building from source on CI has failed here before,
        # so ship the upstream static binary (CGO_ENABLED=0, works on musl) instead.
        #
        # Track the newest tag INCLUDING pre-releases: upstream has published only
        # pre-releases for months, so /releases/latest is stale by many versions.
        # Set the XRAY_VERSION repository variable to pin a specific version instead.
        # The API call is authenticated: the anonymous limit is 60/hour per IP and
        # Actions runners share outbound IPs, so unauthenticated calls can hit 403.
        VER="${{ vars.XRAY_VERSION }}"
        if [ -z "$VER" ]; then
          # Write to a file and parse the file. Piping curl into grep -m1 closes the
          # pipe as soon as the first match is found; curl then exits 23 and
          # pipefail turns that into a step failure every single time.
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
               -o /tmp/xray-releases.json \
               "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=1"
          VER=$(awk -F'"' '/"tag_name"/{sub(/^v/,"",$4); print $4; exit}' /tmp/xray-releases.json)
        fi
        [ -n "$VER" ] || { echo "::error::could not resolve an Xray version"; exit 1; }
        echo "Using Xray ${VER}"
        ASSET="${{ inputs.xray_asset }}"
        BASE="https://github.com/XTLS/Xray-core/releases/download/v${VER}"
        wget -q "${BASE}/${ASSET}" -O /tmp/xray.zip
        # Verify against the checksum upstream publishes next to the asset.
        wget -q "${BASE}/${ASSET}.dgst" -O /tmp/xray.dgst
        SHA=$(grep -iE '^sha2?-?256' /tmp/xray.dgst | head -1 | awk '{print $NF}')
        [ -n "$SHA" ] || { echo "::error::no sha256 in upstream .dgst"; exit 1; }
        echo "${SHA}  /tmp/xray.zip" | sha256sum -c -
        mkdir -p "$GITHUB_WORKSPACE/files/usr/bin" "$GITHUB_WORKSPACE/files/etc"
        unzip -p /tmp/xray.zip xray > "$GITHUB_WORKSPACE/files/usr/bin/xray"
        chmod 755 "$GITHUB_WORKSPACE/files/usr/bin/xray"
        file "$GITHUB_WORKSPACE/files/usr/bin/xray"
        file "$GITHUB_WORKSPACE/files/usr/bin/xray" | grep -q '${{ inputs.xray_arch }}' \
          || { echo "::error::xray binary architecture mismatch"; exit 1; }
        if [ "${{ inputs.xray_runnable }}" = "true" ]; then
          # Only when the binary matches the runner's own architecture.
          V=$("$GITHUB_WORKSPACE/files/usr/bin/xray" version | head -1); echo "$V"
          echo "$V" | grep -q "${VER}" || { echo "::error::binary reports $V, expected ${VER}"; exit 1; }
        fi
        # Record what actually shipped, so the running device can be checked later.
        echo "${VER}" > "$GITHUB_WORKSPACE/files/etc/xray.version"
        echo "xray ${VER} (${ASSET})" >> "$GITHUB_STEP_SUMMARY"
        ls -la "$GITHUB_WORKSPACE/files/usr/bin/xray"

    - name: Set up a host Go for bootstrapping
      # The feeds otherwise compile Go from go1.4 through several intermediate
      # releases just to obtain a compiler that can build the real one. Since Go
      # 1.21 the toolchain is reproducible whatever bootstraps it, so this changes
      # nothing in the image. "stable" is always new enough to bootstrap the feed.
      if: inputs.go_speedups
      uses: actions/setup-go@v6
      with:
        go-version: stable
        cache: false

    - name: Load custom configuration
      id: config
      run: |
        set -euo pipefail
        # NOTE: do NOT use `[ -e X ] && cp X Y` here. Under `bash -e`, a failing test
        # in a non-final `&&` chain does NOT abort the step: the build would silently
        # fall through to `make defconfig`, produce a stock image with none of our
        # packages, and still publish it as a release.
        CFG="$GITHUB_WORKSPACE/${{ inputs.config_file }}"
        if [ ! -e "$CFG" ]; then
          echo "::error::config not found: $CFG (renamed? update the caller workflow)"
          exit 1
        fi
        cp "$CFG" openwrt/.config
        cd openwrt
        git clone --depth=1 -b js https://github.com/iskoldt-X/luci-theme-design.git package/luci-theme-design-x
        grep -qxF 'CONFIG_PACKAGE_luci-theme-design-x=y' .config || echo 'CONFIG_PACKAGE_luci-theme-design-x=y' >> .config
        if [ -d "$GITHUB_WORKSPACE/files" ]; then
          mkdir -p files
          cp -a "$GITHUB_WORKSPACE/files/." files/
        fi
        if [ "${{ inputs.go_speedups }}" = "true" ]; then
          GOROOT_HOST=$(go env GOROOT)
          echo "CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT=\"${GOROOT_HOST}\"" >> .config
          # Only some golang feeds have this switch; defconfig ignores it elsewhere.
          echo '# CONFIG_GOLANG_BUILD_BOOTSTRAP is not set' >> .config
        fi
        make defconfig
        if [ "${{ inputs.go_speedups }}" = "true" ]; then
          grep -qx "CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT=\"${GOROOT_HOST}\"" .config \
            || { echo "::error::defconfig lost CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT"; exit 1; }
        fi
        # Guard against a silently emptied config: if the target or a signature
        # package vanished, stop now rather than shipping a stock image.
        grep -qx '${{ inputs.target_assert }}' .config \
          || { echo "::error::defconfig lost ${{ inputs.target_assert }}"; exit 1; }
        grep -qx '${{ inputs.package_assert }}' .config \
          || { echo "::error::defconfig lost ${{ inputs.package_assert }}"; exit 1; }
        # ccache is opt-in per device config. CONFIG_CCACHE only has a prompt when
        # CONFIG_DEVEL=y, so without DEVEL defconfig drops it without a word and the
        # build silently runs uncached.
        if grep -qx 'CONFIG_CCACHE=y' "$CFG"; then
          grep -qx 'CONFIG_CCACHE=y' .config \
            || { echo "::error::defconfig lost CONFIG_CCACHE=y (is CONFIG_DEVEL=y set?)"; exit 1; }
          echo "ccache=true" >> "$GITHUB_OUTPUT"
          # Part of the cache key: a toolchain change starts a fresh cache instead of
          # reusing objects built by a compiler that may differ under the same version.
          echo "toolchain=$(git log -1 --format=%h -- toolchain include/toolchain-build.mk)" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore Go cache
      # Before the download step, so the module cache does not land on top of
      # read-only directories that `make download` may already have created.
      id: gocache_restore
      if: inputs.go_speedups
      uses: actions/cache/restore@v5
      with:
        path: |
          /workdir/openwrt/tmp/go-build
          /workdir/openwrt/dl/go-mod-cache
        key: gocache-${{ inputs.tag_prefix }}-${{ github.run_id }}
        restore-keys: gocache-${{ inputs.tag_prefix }}-

    - name: Mark the Go build cache as recently used
      # Go deletes build-cache entries it has not used for 5 days (trimLimit in
      # cmd/go/internal/cache, not configurable). It reads "last used" from each
      # file's mtime, and the restore keeps the old mtimes, so a weekly build would
      # see everything as stale and wipe it on the first go command. Resetting the
      # mtimes keeps the cache whatever the gap between runs; entries are content
      # addressed, so the timestamp has no bearing on correctness.
      if: steps.gocache_restore.outputs.cache-matched-key != ''
      run: |
        find /workdir/openwrt/tmp/go-build -type f -exec touch -c {} +
        du -sh /workdir/openwrt/tmp/go-build /workdir/openwrt/dl/go-mod-cache || true

    - name: Download packages
      run: |
        set -euo pipefail
        cd openwrt
        make download -j8
        # A truncated download shows up as a tiny file; drop it so make refetches.
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Restore compiler cache
      id: ccache_restore
      if: steps.config.outputs.ccache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: /workdir/openwrt/.ccache
        key: ccache-${{ inputs.tag_prefix }}-${{ steps.config.outputs.toolchain }}-${{ github.run_id }}
        restore-keys: ccache-${{ inputs.tag_prefix }}-${{ steps.config.outputs.toolchain }}-

    - name: Configure ccache
      if: steps.config.outputs.ccache == 'true'
      run: |
        set -euo pipefail
        mkdir -p /workdir/openwrt/.ccache
        # compiler_check: the cross gcc is rebuilt on every run, and its version
        # string embeds the source revision (PKGVERSION in toolchain/gcc/common.mk).
        # The default mtime check, and the content or -v checks, would therefore
        # miss on every target object. Machine plus version is stable week to week;
        # the toolchain hash in the cache key covers changes underneath it.
        # max_size: some trees export CCACHE_NOCOMPRESS, so leave room on disk.
        cat > /workdir/openwrt/.ccache/ccache.conf <<'EOF'
        max_size = 5G
        compiler_check = %compiler% -dumpmachine; %compiler% -dumpversion
        EOF
        CCACHE_DIR=/workdir/openwrt/.ccache ccache -z

    - name: Compile the firmware
      # With ccache on, stop short of the 6-hour job limit so the cache still gets
      # saved: a cold first run can run long, and a job killed at the limit saves
      # nothing, which would leave every following run cold as well.
      timeout-minutes: ${{ steps.config.outputs.ccache == 'true' && 300 || 360 }}
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        make -j"$(nproc)" || make -j1 || make -j1 V=s

    - name: Show ccache statistics
      if: always() && steps.ccache_restore.outcome == 'success'
      run: |
        # Prefer the ccache the tree built for itself; it wrote most of the entries.
        CC=/workdir/openwrt/staging_dir/host/bin/ccache
        [ -x "$CC" ] || CC=ccache
        CCACHE_DIR=/workdir/openwrt/.ccache "$CC" -s || true
        du -sh /workdir/openwrt/.ccache || true

    - name: Save compiler cache
      # Saved even when the compile failed or timed out: a partial cache still
      # moves the next run further along.
      if: always() && steps.ccache_restore.outcome == 'success'
      uses: actions/cache/save@v5
      with:
        path: /workdir/openwrt/.ccache
        key: ccache-${{ inputs.tag_prefix }}-${{ steps.config.outputs.toolchain }}-${{ github.run_id }}

    - name: Show Go cache size
      if: always() && steps.gocache_restore.outcome == 'success'
      run: du -sh /workdir/openwrt/tmp/go-build /workdir/openwrt/dl/go-mod-cache || true

    - name: Save Go cache
      if: always() && steps.gocache_restore.outcome == 'success'
      uses: actions/cache/save@v5
      with:
        path: |
          /workdir/openwrt/tmp/go-build
          /workdir/openwrt/dl/go-mod-cache
        key: gocache-${{ inputs.tag_prefix }}-${{ github.run_id }}

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      run: |
        set -euo pipefail
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

    - name: Generate release tag
      id: tag
      run: |
        set -euo pipefail
        # Built here from `date` rather than passed down from an earlier step: a tag
        # that depends on an upstream variable can come out empty and takes the
        # release action down with a 422 that says nothing about the real failure.
        echo "release_tag=${{ inputs.tag_prefix }}-$(date +'%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.tag.outputs.release_tag }}
        path: ${{ env.FIRMWARE }}

    - name: Publish release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        body: ${{ inputs.tag_prefix }} built from ${{ inputs.source_url }} ${{ inputs.source_branch }}
        artifacts: ${{ env.FIRMWARE }}/*
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Prune old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 30
        keep_minimum_runs: 3
        delete_workflow_pattern: ${{ github.workflow }}

    - name: Prune old releases
      # Plain gh instead of freenet-actions/delete-old-releases: its v2 targets the
      # deprecated Node 20, and every v3 tag (Node 24) still ships without
      # node_modules, so it dies with "Cannot find module '@actions/core'".
      # Same policy as before: only this device's own tags (PREFIX-YYYYmmddHHMM;
      # other devices' releases are never touched), always keep the newest one,
      # delete the rest once they are older than 30 days, tags included.
      env:
        GH_TOKEN: ${{ github.token }}
        PREFIX: ${{ inputs.tag_prefix }}
      run: |
        set -euo pipefail
        cutoff=$(date -u -d '30 days ago' +%s)
        gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt \
          --jq '[.[] | select(.tagName | test("^" + env.PREFIX + "-[0-9]{12}$"))]
                | sort_by(.createdAt) | reverse | .[1:][]
                | select((.createdAt | fromdateiso8601) < '"$cutoff"') | .tagName' \
          > /tmp/prune.txt
        echo "releases to prune: $(wc -l < /tmp/prune.txt)"
        while read -r tag; do
          [ -n "$tag" ] || continue
          echo "deleting $tag"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
        done < /tmp/prune.txt
